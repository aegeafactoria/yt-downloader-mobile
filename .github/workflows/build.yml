name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies & Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git python3-pip python3-setuptools \
            python3-dev libffi-dev libssl-dev libtinfo5 openjdk-17-jdk zip unzip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libsqlite3-dev
          pip install --upgrade pip setuptools buildozer cython

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Pro-APK
          path: bin/*.apk
